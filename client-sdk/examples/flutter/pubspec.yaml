name: wabi_flutter_example
description: >-
  Flutter app using the Wabi client SDK. The core library is bundled by the
  SDK's build hook (Dart native assets): no jniLibs, xcframework, DLL or dylib
  to copy by hand.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  wabi_client:
    path: ../../sdk/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Configuration of the SDK's build hook (docs/FLUTTER.md). Without prebuilt_dir
# the SDK looks in client-sdk/build/native (scripts/build-native.sh).
hooks:
  user_defines:
    wabi_client:
      required: true # a missing core library fails the build instead of the app start
