name: acme_client
description: >-
  Acme client SDK for Dart and Flutter. Generated from wit/client.wit plus a
  generic dart:ffi runtime; works with any core implementing the Acme native ABI (abi/acme_abi.h).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
