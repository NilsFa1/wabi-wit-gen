name: gematik_zero
description: >-
  PoC: DPoP proofs from gematik libzero (Go core) for Dart and Flutter. The app
  keeps the private key and signs via ABI 1.1 host calls (import host-keys).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  lints: ^5.0.0
  pointycastle: ^3.9.0
  test: ^1.25.0
