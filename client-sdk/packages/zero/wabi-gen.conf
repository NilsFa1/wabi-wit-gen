# wabi-wit-gen configuration of the gematik:zero PoC package.
# Three interchangeable cores implement it: Go (with gematik libzero), Rust, C#.
abi      = ../../abi
targets  = c csharp java swift dart ts go rust csharp-core
go_out   = core-go/wabi_generated.go
rust_out = core-rust/src/generated.rs
csharp_core_out = core-csharp/generated
