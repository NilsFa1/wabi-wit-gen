[package]
name = "gematik-zero-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "gematik:zero PoC core in Rust: DPoP proofs (RFC 9449), signing via host calls"
publish = false

[lib]
# libgematik_zero.so — a drop-in replacement for the Go core (same package, same symbols)
name = "gematik_zero"
crate-type = ["cdylib", "staticlib"]

[dependencies]
wabi-abi-rt = { path = "../../../runtime/rust" }
base64 = "0.22"
getrandom = "0.3"
serde_json = "1"
sha2 = "0.10"

[profile.release]
panic = "unwind" # catch_unwind at the FFI boundary
