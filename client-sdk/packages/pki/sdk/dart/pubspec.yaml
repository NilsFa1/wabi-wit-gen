name: gematik_pki
description: >-
  PoC: TUC_PKI_018 certificate verification from gematik ref-GemLibPki (Java,
  compiled with GraalVM native-image) for Dart and Flutter — no JVM needed.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0" # native assets (hook/build.dart)

dependencies:
  code_assets: ^2.1.0 # hook/build.dart
  crypto: ^3.0.6 # hook/build.dart: release checksums
  ffi: ^2.1.0
  hooks: ^2.2.0 # hook/build.dart

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
