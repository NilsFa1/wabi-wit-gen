# acme-wit-gen configuration of the gematik:pki PoC package. Two interchangeable
# cores implement it:
#   core-java  gematik ref-GemLibPki (Java), GraalVM native-image (core-java/README.md)
#   core-go    gematik zero-lab gempki (Go) + TUC_PKI_018 layer, EUPL-1.2 (core-go/README.md)
abi           = ../../abi
targets       = c csharp java swift dart java-core go
java_core_out = core-java/src/generated/java
go_out        = core-go/acme_generated.go
