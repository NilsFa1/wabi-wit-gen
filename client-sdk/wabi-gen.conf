# wabi-wit-gen configuration of package wabi:client (paths relative to this file)
abi      = abi
targets  = c csharp java swift dart rust go csharp-core
rust_out = core-rust/src/generated/mod.rs
go_out   = alt-cores/go/wabi_generated.go
csharp_core_out = alt-cores/csharp/generated
# Dart build hook (native assets): where scripts/build-native.sh puts the libraries,
# relative to the Dart package sdk/dart
dart_prebuilt_dir = ../../build/native
