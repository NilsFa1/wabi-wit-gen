[package]
name = "acme-client-core"
version = "0.1.0"
edition = "2021"
description = "Acme client core (Rust implementation of the Acme native ABI v1)"
publish = false

[lib]
# libacme_client.so / libacme_client.dylib / acme_client.dll (+ .a for iOS xcframework)
name = "acme_client"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "acme-mock-server"
path = "src/bin/mock_server.rs"

[features]
default = ["mock-backend"]
# In-process loopback backend behind `mem://` endpoints (tests, examples, CI).
mock-backend = []

[dependencies]
# Contract-agnostic ABI runtime (handles, futures, streams, codec, host calls, exports)
acme-abi-rt = { path = "../runtime/rust" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tokio-tungstenite = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"

[profile.release]
# catch_unwind at the FFI boundary requires unwinding panics.
panic = "unwind"
lto = "thin"
