name: pki-mobile

# Experiment: can the gematik:pki Java core (gemLibPki) be compiled for Android
# and iOS with Gluon Substrate + Gluon's GraalVM? Builds the native library and
# checks its exported symbols; nothing is run on a device yet.
on:
  workflow_dispatch:
  push:
    paths:
      - "client-sdk/packages/pki/core-java/**"
      - "client-sdk/runtime/java-core/**"
      - ".github/workflows/pki-mobile.yml"

defaults:
  run:
    working-directory: client-sdk

jobs:
  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: android, os: ubuntu-24.04, graal: linux-amd64 }
          - { target: ios, os: macos-15, graal: darwin-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Gluon GraalVM (${{ matrix.graal }})
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/gluonhq/graal/releases?per_page=20" \
            | jq -r '[.[].assets[] | select(.name | test("^graalvm-java[0-9]+-${{ matrix.graal }}-gluon-.*\\.(tar\\.gz|zip)$")) | .browser_download_url][0]')
          echo "Gluon GraalVM: $url"
          mkdir -p "$RUNNER_TEMP/gluon-graal" && cd "$RUNNER_TEMP/gluon-graal"
          curl -fsSL -o graal.tgz "$url" && tar xzf graal.tgz
          home=$(dirname "$(dirname "$(find "$PWD" -path '*/bin/native-image' | head -1)")")
          echo "GRAALVM_HOME=$home" >> "$GITHUB_ENV"
          "$home/bin/java" -version
      - name: Android SDK/NDK from the runner image
        if: matrix.target == 'android'
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
      - name: build (${{ matrix.target }})
        run: packages/pki/core-java/build-mobile.sh ${{ matrix.target }}
      - name: native-image log on failure
        if: failure()
        run: find packages/pki/core-java/target/gluonfx -name "*.log" -exec sh -c 'echo "== $1"; tail -150 "$1"' _ {} \; || true
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: "pki-${{ matrix.target }}", path: "client-sdk/build/pki-mobile/${{ matrix.target }}" }
