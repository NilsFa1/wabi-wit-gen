name: pki-go

# The gematik:pki Go core (gempki, EUPL-1.2) cross-compiled for every platform
# the SDKs run on; on macOS the Swift SDK tests run against it.
on:
  workflow_dispatch:
  push:
    paths:
      - "client-sdk/packages/pki/**"
      - "client-sdk/runtime/go/**"
      - "client-sdk/abi/**"
      - ".github/workflows/pki-go.yml"

defaults:
  run:
    working-directory: client-sdk

jobs:
  linux-windows-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache-dependency-path: client-sdk/packages/pki/core-go/go.sum }
      - run: pip install ziglang==0.16.0
      - name: unit tests
        working-directory: client-sdk/packages/pki/core-go
        run: go vet ./... && test -z "$(gofmt -l .)" && go test -count=1 ./...
      - run: packages/pki/core-go/build.sh linux-x64
      - run: packages/pki/core-go/build.sh linux-arm64
      - run: packages/pki/core-go/build.sh windows-x64
      - run: ANDROID_NDK=$ANDROID_NDK_LATEST_HOME packages/pki/core-go/build.sh android
      - uses: actions/upload-artifact@v4
        with: { name: pki-go-linux-windows-android, path: client-sdk/build/pki-go }

  macos-ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache-dependency-path: client-sdk/packages/pki/core-go/go.sum }
      - run: go mod download && go version
        working-directory: client-sdk/packages/pki/core-go
      - run: packages/pki/core-go/build.sh macos
        timeout-minutes: 10
      - run: packages/pki/core-go/build.sh ios
        timeout-minutes: 10
      - name: Swift SDK tests against the Go core (macOS)
        working-directory: client-sdk/packages/pki/sdk/swift
        run: |
          LIB=$GITHUB_WORKSPACE/client-sdk/build/pki-go/macos
          PKI_FIXTURES=$GITHUB_WORKSPACE/client-sdk/packages/pki/tests/fixtures \
            DYLD_LIBRARY_PATH=$LIB swift test -Xlinker -L$LIB -Xlinker -rpath -Xlinker $LIB
      - uses: actions/upload-artifact@v4
        with: { name: pki-go-macos-ios, path: client-sdk/build/pki-go }
