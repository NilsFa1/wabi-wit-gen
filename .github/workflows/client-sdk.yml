name: client-sdk

on:
  push:
    paths: ["client-sdk/**", ".github/workflows/client-sdk.yml"]
  pull_request:
    paths: ["client-sdk/**", ".github/workflows/client-sdk.yml"]

defaults:
  run:
    working-directory: client-sdk

jobs:
  review-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: generator and released API baselines
        run: |
          cargo test --manifest-path generator/Cargo.toml
          cargo run --manifest-path generator/Cargo.toml -- --root . --check
          cargo run --manifest-path generator/Cargo.toml -- --root packages/zero --check
          cargo run --manifest-path generator/Cargo.toml -- --root packages/pki --check
      - name: generic runtimes
        run: |
          cargo test --manifest-path runtime/rust/Cargo.toml
          cd runtime/go
          go vet ./...
          go test -race ./...
      - name: PKI trust-generation regression tests
        working-directory: client-sdk/packages/pki/core-go
        run: go vet ./... && go test -race -count=1 ./...

  linux-matrix:
    # Generator checks, Rust core tests, and the compatibility matrix:
    # C ABI conformance + unchanged C#/Java test binaries against Rust, Go and Zig cores.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      # GraalVM first: it also puts its (JDK 21) java/javac on PATH; the setup-java step
      # afterwards puts JDK 25 in front again. native-image is found via GRAALVM_HOME.
      - uses: graalvm/setup-graalvm@v1 # native-image for the gematik:pki Java core
        with: { java-version: "21", distribution: graalvm, set-java-home: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: dart-lang/setup-dart@v1
      - uses: oven-sh/setup-bun@v2 # TypeScript SDK (bun:ffi), packages/zero
      - run: pip install ziglang==0.16.0
      - run: (cd sdk/dart && dart pub get && dart analyze --fatal-infos)
      - run: (cd packages/zero/sdk/dart && dart pub get && dart analyze --fatal-infos)
      - run: (cd packages/pki/sdk/dart && dart pub get && dart analyze --fatal-infos)
      - run: (cd examples/dart && dart pub get && dart analyze --fatal-infos)
      - run: sudo apt-get install -y libssl-dev # tests/abi/host_calls.c uses OpenSSL as the app keystore
      - run: scripts/test-all.sh

  swift-macos:
    # Swift cannot be built in the Linux container used to write this PoC; verify it here.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path core-rust/Cargo.toml
      - name: swift build + test against the Rust core
        working-directory: client-sdk/sdk/swift
        run: |
          LIB=$GITHUB_WORKSPACE/client-sdk/core-rust/target/release
          swift build -Xlinker -L$LIB
          DYLD_LIBRARY_PATH=$LIB swift test -Xlinker -L$LIB
          DYLD_LIBRARY_PATH=$LIB swift run -Xlinker -L$LIB WabiExample
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: gematik:zero host calls from Swift (Security framework as keystore)
        run: |
          LIB=$GITHUB_WORKSPACE/client-sdk/build/zero
          mkdir -p $LIB
          (cd packages/zero/core-go && go build -buildmode=c-shared -o $LIB/libgematik_zero.dylib .)
          cd packages/zero/sdk/swift
          DYLD_LIBRARY_PATH=$LIB swift test -Xlinker -L$LIB
      - uses: oven-sh/setup-bun@v2
      - name: gematik:zero host calls from TypeScript/Bun (bun:ffi, AAPCS64 calling convention)
        run: |
          cd packages/zero/sdk/ts
          bun install --frozen-lockfile && bun x tsc --noEmit
          WABI_NATIVE_LIB=$GITHUB_WORKSPACE/client-sdk/build/zero/libgematik_zero.dylib bun test

  bun-windows:
    # The TypeScript SDK passes wabi_bytes/wabi_buffer by reference on Win64
    # (by value in two registers on SysV/AAPCS64): verify that path natively.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: client-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - run: (cd packages/zero/core-rust && cargo build --release --lib)
      - name: gematik:zero host calls from TypeScript/Bun on Windows
        run: |
          cd packages/zero/sdk/ts
          bun install --frozen-lockfile && bun x tsc --noEmit
          WABI_NATIVE_LIB="$(cygpath -w "$GITHUB_WORKSPACE/client-sdk/packages/zero/core-rust/target/release/gematik_zero.dll")" bun test

  wabi-wit-gen-npm:
    # The generator as WebAssembly in the npm package wabi-wit-gen: package mode
    # --check on every package, standalone output byte-equal to the native build,
    # and the bundled example (WIT -> Rust core via the generated build-native.sh ->
    # Bun, Dart package with build hook, NuGet package), on every OS (Windows: drive
    # mapping of the WASI launcher, MSVC core build).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: client-sdk
    steps:
      # --check compares byte for byte: keep LF line endings on Windows too.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - uses: dart-lang/setup-dart@v1 # example: Dart package with build hook
      - uses: actions/setup-dotnet@v4 # example: NuGet package
        with: { dotnet-version: "8.0.x" }
      - run: generator/npm/build.sh
      - run: generator/npm/test.sh

  # Flutter: the SDK's build hook (Dart native assets) bundles the core; the example
  # app has no manual native setup. Platform projects are created on the fly.
  flutter-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - run: cargo build --release --lib --manifest-path core-rust/Cargo.toml
      - run: mkdir -p build/native/linux-x64 && cp core-rust/target/release/libwabi_client.so build/native/linux-x64/
      - name: flutter analyze + widget test (host) + integration test (Linux desktop)
        working-directory: client-sdk/examples/flutter
        run: |
          flutter create --platforms=linux .
          flutter analyze
          flutter test
          xvfb-run -a flutter test integration_test -d linux
          flutter build linux --release
          test -f build/linux/x64/release/bundle/lib/libwabi_client.so

  flutter-android:
    runs-on: ubuntu-24.04
    steps:
      # NDK builds + Gradle + the emulator system image exceed the runner's free disk
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell && df -h /
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME scripts/build-native.sh android
      - name: flutter build apk (arm64-v8a, armeabi-v7a, x86_64)
        working-directory: client-sdk/examples/flutter
        run: |
          flutter create --platforms=android .
          flutter build apk --debug
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep libwabi_client.so
      - run: rm -rf core-rust/target && df -h / # the emulator image needs the space
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: integration test on the x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: client-sdk/examples/flutter
          script: flutter test integration_test -d emulator-5554

  flutter-apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: scripts/build-native.sh apple
      - name: macOS desktop
        working-directory: client-sdk/examples/flutter
        run: |
          flutter create --platforms=macos,ios .
          flutter test integration_test -d macos
      - name: iOS simulator
        working-directory: client-sdk/examples/flutter
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          flutter test integration_test -d "$UDID"
          flutter build ios --no-codesign

  flutter-windows:
    runs-on: windows-latest
    defaults:
      run: { shell: bash, working-directory: client-sdk }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: scripts/build-native.sh windows
      - name: Windows desktop
        working-directory: client-sdk/examples/flutter
        run: |
          flutter create --platforms=windows .
          flutter test integration_test -d windows

  native-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get install -y gcc-mingw-w64-x86-64 && pip install ziglang==0.16.0
      - run: scripts/build-native.sh linux && scripts/build-native.sh windows
      - uses: actions/upload-artifact@v4
        with: { name: native, path: client-sdk/build/native }
